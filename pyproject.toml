[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guiplotter"
version = "0.1.0"
description = "GUI plotter for columnar data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "matplotlib>=3.8"
]

[project.gui-scripts]
guiplotter = "guiplotter.entrypoints:space_delimited_main"
guiplotter-space = "guiplotter.entrypoints:space_delimited_main"

[project.scripts]
guiplotter-make-app = "guiplotter.macos_app:main"

[tool.setuptools.packages.find]
where = ["src"]
